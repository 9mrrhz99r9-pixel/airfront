<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="./css/style.css">
<title>SKY DEFENDER</title>
</head>
<body>
<canvas id="game"></canvas>

<div id="titleScreen" class="screen">
  <h1>SKY DEFENDER</h1>
  <button id="startButton">START</button>
  <button id="skinButton">機体選択</button>
</div>

<div id="skinScreen" class="screen hidden">
  <h1>機体選択</h1>

  <!-- 上半分：選択中の機体 -->
  <div id="skinPreview">
    <div id="skinPreviewImage"></div>
    <h2 id="skinPreviewName">標準迎撃機</h2>
    <p id="skinPreviewHint"></p>
  </div>

  <!-- 下半分：機体一覧 -->
  <div id="skinListArea">
    <div id="skinList"></div>
  </div>

  <button id="skinBackButton">戻る</button>
</div>

<div id="gameOverScreen" class="screen hidden">
  <h1>GAME OVER</h1>
  <div id="result"></div>
  <button id="retryButton">リトライ</button>
  <button id="titleButton">タイトルへ戻る</button>
</div>

<button id="fireButton" class="hidden">発砲</button>
<div id="hint" class="hidden">画面を左右にスライドして移動</div>
<script src="./js/game.js"></script>
</body>
</html>
