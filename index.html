<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="./css/style.css">
<title>SKY DEFENDER</title>
</head>
<body>
<canvas id="game"></canvas>

<div id="titleScreen" class="screen">
  <h1>SKY DEFENDER</h1>
  <button id="startButton">START</button>
</div>

<div id="modeScreen" class="screen hidden">
  <h1>MODE SELECT</h1>

  <button id="skinButton">SKIN SELECT</button>
  <button id="bossButton">BOSS BATTLE</button>
  <button id="scoreButton">SCORE ATTACK</button>
</div>

<div id="bossSelectScreen" class="screen hidden">
  <h1>BOSS SELECT</h1>

<div id="bossSelectLayout">
  
  <div id="bossInfo">
  <h2 id="bossInfoName">未選択</h2>
  <p id="bossInfoText">ボスを選択してください。</p>
  <div id="bossRecordList"></div>
</div>

</div>

  <div id="bossList">
    <h2>BOSS LIST</h2>
    <button id="taintButton">TAINT</button>
  </div>

  <button id="bossBackButton">戻る</button>
  <button id="bossStartButton">BATTLE START</button>
</div>

<!-- アタッチメント選択画面 -->
<div id="attachmentScreen" class="screen hidden">
  <h1>ATTACHMENTS</h1>

  <!-- 上半分：選択中のアタッチメント情報 -->
  <div id="attachmentInfo">
    <h2 id="attachmentInfoName">未装備</h2>
    <p id="attachmentInfoRarity"></p>
    <p id="attachmentInfoEffect"></p>
    <p id="attachmentInfoCount"></p>
    <p id="attachmentInfoStatus"></p>

    <button id="attachmentEquipButton" class="hidden">装備</button>
    <button id="attachmentSynthesizeButton" class="hidden">合成</button>
    <p id="attachmentSynthesizeHint"></p>
  </div>

  <!-- 下半分：アタッチメント一覧 -->
  <div id="attachmentListArea">
    <div id="attachmentList"></div>
  </div>

  <button id="attachmentBackButton">戻る</button>
</div>

<div id="skinScreen" class="screen hidden">
  <h1>機体選択</h1>

  <!-- 上半分：選択中の機体 -->
  <div id="skinPreview">
    <div id="skinPreviewImage"></div>
    <h2 id="skinPreviewName">標準迎撃機</h2>
    <p id="skinPreviewHint"></p>
  </div>

  <!-- 下半分：機体一覧 -->
  <div id="skinListArea">
    <div id="skinList"></div>
  </div>

    <button id="attachmentSelectButton">ATTACHMENTS</button>
  <button id="skinBackButton">戻る</button>
</div>

<div id="gameOverScreen" class="screen hidden">
  <h1 id="resultTitle">GAME OVER</h1>
  <div id="result"></div>
  <button id="retryButton">リトライ</button>
  <button id="titleButton">タイトルへ戻る</button>
</div>

<script src="./js/config.js"></script>
<script src="./js/images.js"></script>
<script src="./js/data/storage.js"></script>
<script src="./js/game.js"></script>
</body>
</html>
